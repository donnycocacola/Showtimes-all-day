name: 更新場次

on:
  schedule:
    # 台北時間 每天 07:00–翌日 01:00，每 2 小時一次（cron 用 UTC）
    - cron: "5 23,1,3,5,7,9,11,13,15,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 抓場次
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python scraper/run.py
      - name: 存回 repo
        run: |
          git config user.name "showtimes-bot"
          git config user.email "showtimes-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "沒有變動" && exit 0
          git commit -m "更新場次 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
          git pull --rebase origin main
          git push
