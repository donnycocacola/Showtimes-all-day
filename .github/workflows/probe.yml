name: 研究網站（開發用）

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "要研究哪幾家（空白=全部），例如 vieshow showtimes"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: 執行
        env:
          SITES: ${{ github.event.inputs.sites }}
        run: python scraper/probe.py $SITES
      - name: 存回 repo
        run: |
          git config user.name "showtimes-bot"
          git config user.email "showtimes-bot@users.noreply.github.com"
          git add -f debug
          git diff --cached --quiet && exit 0
          git commit -m "probe: 網站原始碼"
          git pull --rebase origin main
          git push
